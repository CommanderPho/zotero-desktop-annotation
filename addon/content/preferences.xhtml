<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>
  <checkbox
    id="zotero-prefpane-__addonRef__-enableHotkeys"
    preference="enableHotkeys"
    data-l10n-id="pref-enable-hotkeys"
  />
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-text-fontSize"
      data-l10n-id="pref-text-font-size"
    ></html:label>
    <html:input
      type="number"
      min="4"
      max="192"
      step="1"
      id="zotero-prefpane-__addonRef__-text-fontSize"
      preference="text.fontSize"
    ></html:input>
  </hbox>
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-text-color"
      data-l10n-id="pref-text-color"
    ></html:label>
    <html:input
      type="color"
      id="zotero-prefpane-__addonRef__-text-color"
      preference="text.color"
    ></html:input>
  </hbox>
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-noteIconScalePercent"
      data-l10n-id="pref-note-icon-scale"
    ></html:label>
    <html:input
      type="number"
      min="35"
      max="100"
      step="5"
      id="zotero-prefpane-__addonRef__-noteIconScalePercent"
      preference="noteIconScalePercent"
    ></html:input>
  </hbox>
  <label><html:h2 data-l10n-id="pref-hotkeys-title"></html:h2></label>
  <html:p data-l10n-id="pref-hotkeys-help"></html:p>
</groupbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
